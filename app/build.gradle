plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    // Compose Hot Reload(HotSwan) 2.1.0(2026-10-01 상향, 2.0.0 으로 재활성화) — 변환 태스크는 debug 빌드에만 붙는다(release 태스크 그래프에는 없음).
    // 1.2.1 이 Kotlin 2.4.0 컴파일러 확장 등록 API 와 충돌해(ClassCastException) 2026-06-16 부터 주석 처리했던 줄을
    // 2026-09-15 2.0.0 으로 재활성화했다. 2.0 공식 요구는 AGP 9.x — 2026-09-29 AGP 9.4.1 상향으로 공식 지원 범위 안에 들어왔다
    // (SKIPPED 42개 목록 상향 전후 동일 + 실기기 logcat "HotSwanV2: v2 server listening" 확인).
    // 빌드 로그의 `w: [HotSwan v2] SKIPPED ...` 는 핫 리로드 불가 메서드 안내일 뿐 소스 경고가 아니다 — ComposeHotReloadGuide.md 참고
    alias(libs.plugins.hotswan.compiler)
    alias(libs.plugins.kotlin.power.assert)
    // kotlinx-serialization 컴파일러 플러그인(#123, 2026-10-08 사용자 승인) — @Serializable 클래스의 serializer 생성.
    // Kotlin 에 포함돼 배포되며 런타임은 아래 kotlinxSerializationCore(전이와 같은 1.11.0).
    alias(libs.plugins.kotlin.serialization)

    id 'kotlin-parcelize'
}

apply {
    from('../config.gradle')
    from('../core-dependencies.gradle')
}

android {
    defaultConfig {
        applicationId "com.example.composesample"
        versionCode libs.versions.versionCode.get().toInteger()
        versionName libs.versions.versionName.get()

        // local.properties에서 API 키 로드
        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file('local.properties')
        if (localPropertiesFile.exists()) {
            localProperties.load(new FileInputStream(localPropertiesFile))
        }
        buildConfigField "String", "NAVER_CLIENT_ID", "\"${localProperties['NAVER_CLIENT_ID'] ?: ''}\""
        buildConfigField "String", "NAVER_CLIENT_SECRET", "\"${localProperties['NAVER_CLIENT_SECRET'] ?: ''}\""
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    namespace = 'com.example.composesample'
}

// HotSwan(debug 핫 리로드)에서 뺄 클래스 — 실행 결과가 release 와 달라지는 것들(실기기 실측, ComposeHotReloadGuide.md)
// Power-Assert 와 함께 쓸 때의 두 가지 문제:
// - PowerAssertChecksKt: @PowerAssert 함수 안의 PowerAssert.explanation 은 Power-Assert 플러그인이 바꿔 넣는 intrinsic 인데,
//   HotSwan 이 실행하는 본문에는 그 치환이 없어 원래 스텁이 불려 NotImplementedError 가 난다(JVM 단위 테스트도 동일).
// - PowerAssertViewModel: 변환된 호출부를 HotSwan 이 실행하면 부수효과 있는 식이 여러 번 평가된다
//   (counter.incrementAndGet() 3회 — dispatchRewriteEnabled=false 거나 제외하면 1회).
// LazyListCacheWindowExampleUIKt: prefetch 의 Pausable composition 이 멈추지 않는다 — 스크롤 중 prefetch 된 무거운
//   아이템이 debug 에서는 늘 한 덩어리(약 50ms)였고, release 와 dispatchRewriteEnabled=false 의 debug 에서는 2조각으로 나뉘었다.
// DisplayRefreshRateExampleUIKt · FramePacingMeter: 매 프레임 다시 그리는 프레임 간격 그래프의 그리기 단계가 debug 에서
//   중앙값 44.5ms 라 측정 대상인 프레임 간격 자체가 약 20fps 로 무너진다(dispatchRewriteEnabled=false 의 debug 2.3ms ·
//   release 1.0ms, 60fps). 매 프레임 불리는 측정기 클래스는 파일 facade 와 별개라 따로 뺀다.
hotSwanCompiler {
    exclude("com.example.composesample.presentation.example.component.architecture.development.test.PowerAssertChecksKt")
    exclude("com.example.composesample.presentation.example.component.architecture.development.test.PowerAssertViewModel")
    exclude("com.example.composesample.presentation.example.component.ui.layout.lazycolumn.LazyListCacheWindowExampleUIKt")
    exclude("com.example.composesample.presentation.example.component.system.platform.display.DisplayRefreshRateExampleUIKt")
    exclude("com.example.composesample.presentation.example.component.system.platform.display.FramePacingMeter")
}

// Power-Assert(PowerAssertExample) — 단언 실패 메시지에 식의 중간값을 펼쳐 넣는 컴파일러 플러그인.
// - functions: 호출을 변환할 함수. 마지막 파라미터가 String / () -> String 이어야 한다.
//   @PowerAssert 를 붙인 함수(예제의 powerCheck)는 여기 적지 않아도 변환된다(2.4.20).
// - compilationFilter: 기본값 TESTS 는 컴파일 이름이 정확히 "test" 인 것만 고른다. AGP 의 Kotlin 컴파일은
//   debug / release / debugUnitTest / debugAndroidTest 라서 기본값으로는 어디에도 적용되지 않는다(실측) → 직접 지정.
// - 적용되는 컴파일에는 kotlin-power-assert-runtime(27KB, stdlib 만 의존)이 자동으로 추가된다(addRuntimeDependency 기본 true).
powerAssert {
    functions = ["kotlin.assert", "kotlin.test.assertTrue", "kotlin.test.assertEquals", "kotlin.test.assertNull"]
    compilationFilter = { compilation ->
        compilation.name in ["debug", "release", "debugUnitTest", "releaseUnitTest", "debugAndroidTest"]
    } as org.jetbrains.kotlin.powerassert.gradle.PowerAssertCompilationFilter
}

