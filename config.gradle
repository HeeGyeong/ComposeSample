android {
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    // 바이트코드 타깃은 17 로 고정한다(툴체인은 21 유지).
    // 21 로 두면 Kotlin 이 타입 분기 when 을 JDK 21 의 SwitchBootstraps.typeSwitch invokedynamic 으로
    // 낮추는데, 디버그 빌드에 들어가는 HotSwan 2.0 인터프리터가 그 BSM 을 구현하지 않아(2.0.0 에서 실측)
    // 해당 코드를 실행하는 컴포저블이 크래시 없이 0x0 으로 비어 버린다(실기기 실측).
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

kotlin {
    // jvmToolchain(Int) 오버로드 하나로 JavaLanguageVersion 설정 완결. 람다 블록과 중복 호출 불필요.
    jvmToolchain(libs.versions.javaVersion.get().toInteger())

    // Kotlin 바이트코드 타깃 17 — 위 compileOptions 와 같은 이유(HotSwan typeSwitch).
    // AGP 9 내장 Kotlin 에서는 android { kotlinOptions } 가 없어져 kotlin { compilerOptions } 로 옮겼다.
    // 이 파일은 apply from 스크립트 플러그인이라 KGP 의 JvmTarget 클래스를 직접 참조할 수 없다
    // (별도 클래스로더 — "Could not get unknown property 'org'" 로 실측). 현재 값의 enum 타입에서 valueOf 로 얻는다.
    compilerOptions {
        jvmTarget.set(jvmTarget.get().valueOf('JVM_17'))
    }

    // Kotlin 2.3.20 Name-Based Destructuring (Experimental)
    // 프로젝트 전역 적용은 기존 Pair/Triple 구조 분해와 충돌 → 예제에서 개념만 시연
    // 실제 적용 시: compilerOptions { freeCompilerArgs.add("-Xname-based-destructuring=complete") }
}

