# pom 전이 끌어올림 0: tracing-ktx 1.2.0(프로젝트와 동일) · annotation-experimental 1.4.1(해석 1.5.0) · room 2.7.0(<2.8.5) · coroutines-android 1.9.0(<1.11.0).
