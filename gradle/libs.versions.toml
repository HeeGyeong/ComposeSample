[versions]
# Android
compileSdk = "37"
minSdk = "24"
targetSdk = "35"
versionCode = "1"
versionName = "1.0"

# Java
javaVersion = "21"

# Kotlin & KSP
# kotlin-compose 플러그인(Kotlin 2.x) 사용으로 kotlinCompilerExtension 선언 불필요.
# 2.4.21(2026-10-08, 2.4.20 에서 패치 상향 — DEP-CURRENCY-07): JVM 리플렉션·JS·Wasm·Native·스크립트 버그 수정뿐. compose·power-assert·serialization 플러그인과 kotlin-test-junit 이 이 값을 따른다.
kotlinVersion = "2.4.21"
# KSP 2.3.12(2026-10-01, 2.3.9 에서 패치 상향) — Room 생성 코드 34개 파일이 상향 전과 동일, 앱 클래스패스 4종·프로세서 클래스패스 변화 0.
# lint↔KSP 경쟁 우회(루트 build.gradle 의 mustRunAfter)는 유지 — 2.3.12 의 lint 관련 수정은 Android KMP 대상이라 이 프로젝트와 무관.
ksp = "2.3.12"
# AGP 9.4.1(2026-09-29 상향): Gradle 9.6.0+ 필요, 최대 API 37. AGP 8.x 는 Gradle 9.6+ 에서 제거된 내부 API 를 써서
# Gradle 만 먼저 올릴 수 없다(실측) → wrapper 9.8.0 과 한 번에 올린다. 내장 Kotlin(android.builtInKotlin) 사용 —
# Android 모듈은 org.jetbrains.kotlin.android 를 적용하지 않는다.
applicationVersion = "9.4.1"
libraryVersion = "9.4.1"

# Compose
# Compose BOM이 ui/animation/runtime/foundation/material 등의 개별 버전을 통합 관리한다.
# 개별 라이브러리 선언에서는 version을 지정하지 않음 — BOM이 전파한 버전을 그대로 사용.
# activity 1.13.0 — aar-metadata minCompileSdk=36 / minAGP=8.9.1. 이 버전부터 ComponentActivity 가 core 의 PictureInPictureProvider 를 구현한다(javap 확인).
activityCompose = "1.13.0"
# androidx.navigationevent — back/forward 양방향 내비게이션 이벤트 디스패처.
# 1.1.2 로 도입 → 2026-10-08 1.2.0 stable 로 상향(DEP-CURRENCY-06, 마이너 — 사용자 승인). aar-metadata minCompileSdk=36 / minAGP=8.9.1,
# pom 요구(compose ui/runtime 1.11.2 · lifecycle 2.10.0 · coroutines 1.9.0)는 전부 프로젝트보다 낮다.
# 1.2.0 의 NavigationEventInfo 에 open val title/url(실험)이 생겨, 같은 이름의 val 을 가진 하위 클래스는 override 가 필요하다.
# navigationevent-compose 의 pom 은 compose ui/runtime 1.11.2 를 요구한다. BOM 2026.05.00(→ 1.11.1) 시절에는
# 이 요구가 이겨 ui/runtime 만 1.11.2 로 올라가는 패치 스큐가 있었으나, BOM 2026.06.01(→ 1.11.4) 상향으로
# 요구치가 BOM 보다 낮아져 스큐가 사라졌다. BOM 을 1.11.2 미만으로 내리면 다시 끌어올려진다.
navigationEvent = "1.2.0"
# androidx.navigation3 — ui 가 SceneStrategy/OverlayScene/NavDisplay, runtime 이 NavEntry/entryProvider/metadata 를 제공한다.
# 1.1.7 로 도입(minCompileSdk=36 / minAGP=8.9.1) → 2026-10-01 1.2.0 stable 로 상향(minCompileSdk=37 / minAGP=9.1.0, 현재 37 / 9.4.1).
# 상향 전후 해석 변화는 navigation3 4개 좌표뿐(navigationevent 요청 1.1.1 은 이미 1.1.2 로 해석). Nav3SceneStrategy 예제의
# back·수명주기·onRemove 동작을 back 핸들러 없는 같은 구조 오버레이로 실기기 대조 — 1.1.7 과 동일.
navigation3 = "1.2.0"
# 2026.09.00(2026-09-29 상향) = ui/runtime/foundation/animation/material 1.12.1 · material3 1.4.0 (minCompileSdk=37).
# 1.12 변경 중 영향: foundation Style API 가 스코프 인터페이스로 재편(예제 이관) · DeferredTargetAnimation 정식화
# (ExperimentalAnimatableApi 제거) · 클릭/포커스 이동 시 시스템 효과음 기본 재생 · ui 가 androidx.transition 의존을
# 끊어 transition·dynamicanimation·legacy-support-core-utils 등 레거시 6종이 런타임에서 빠진다.
composeBom = "2026.09.00"

# Lifecycle
# androidx.lifecycle 은 atomic group 이라 runtime/livedata/viewmodel 스택 전체가 한 버전으로 움직인다.
# 2.11.0(2026-09-29 상향, runtime-compose/viewmodel-compose minCompileSdk 37 · 최소 AGP 9.2). JetBrains 포크
# org.jetbrains.androidx.lifecycle 이 "prevents symbols duplication" 제약으로 2.11.0-beta01 로 올라가지만 Android 변형은
# 파일 없는 껍데기(androidx 로 위임)라 베타 코드는 들어오지 않는다.
# (이전) koin-android 4.2.2 가 lifecycle-viewmodel-ktx 2.10.0 을 요구해 스택 전체가 2.10.0 으로 해석되므로 선언을 그에 맞췄다
# (aar-metadata minCompileSdk: viewmodel/runtime 34, runtime-compose 35). 이전 값 2.9.4 는 compose-bom 의
# runtime-saveable 이 요구하던 하한이었다(1.11.4 도 2.9.4 요구 — 지금은 Koin 쪽 요구가 더 높다). (DEP-VERSION-03 과 동일 유형)
lifecycleRuntimeKtx = "2.11.0"
lifecycleLivedataKtx = "2.11.0"
lifecycleViewmodelKtx = "2.11.0"
lifecycleViewmodelCompose = "2.11.0"

# Koin 4.2.2 (DI-01 해소, 2026-09-15). 3.x 대비 코드 영향:
# ① koinViewModel 의 owner 파라미터 이름이 viewModelStoreOwner 로 바뀜 ② org.koin.androidx.compose.get 제거 → org.koin.compose.koinInject
# ③ org.koin.androidx.viewmodel.dsl.viewModel deprecated → org.koin.core.module.dsl.viewModel
# ④ koin-androidx-compose 가 주던 navigation-compose 전이 의존이 사라져 아래 navigationCompose 를 직접 선언한다.
# koin-android 4.2.2 는 lifecycle 2.10.0 · activity-ktx 1.12.4 · fragment-ktx 1.8.9 · appcompat 1.7.1 을 함께 요구한다.
koinCore = "4.2.2"
koinAndroid = "4.2.2"
koinAndroidxCompose = "4.2.2"
# navigation-compose — Koin 3.2.2 의 전이로 들어오던 2.4.2 를 명시 선언해 두었다가 2.9.8 로 상향(DEP-NAV-01).
# 2.10.2(2026-09-29 상향, minCompileSdk 37 · minAGP 9.1.0 — DEP-CURRENCY-02 A). savedstate 를 1.4.0 → 1.5.0 으로
# 함께 끌어올린다(navigation-common 요구, 1.5.0 은 기능 추가만). handleDeepLink 가 엄격해졌지만 딥링크 미사용.
# 사용처는 BottomNavigationActivity 1곳(문자열 route NavHost/composable/navigate — 2.9 에서도 유지되는 API).
navigationCompose = "2.10.2"

# Core-dependencies
# 1.17.0: NotificationCompat.ProgressStyle(Android 16 Live Updates)가 이 버전부터.
# 1.18.0: PictureInPictureParamsCompat / PictureInPictureProvider / PictureInPictureUiStateCompat /
#         DisplayShapeCompat 신규(PiP 예제가 사용).
# 1.19.1(2026-09-29 상향, minCompileSdk 37 / minAGP 9.1.0): core-ktx 가 core 로 병합돼 core-ktx 는 빈 아티팩트다
#         (core-ktx 1.18 의 132개 클래스가 core 1.19.1 에 전부 있음 — 바이너리 호환). BuildCompat.isAtLeastB* deprecated(미사용).
# 선언은 1.13.1 이었지만 실제 해석은 1.16.0 이던 드리프트를 2026-09-02 에 함께 해소했다.
# core-ktx 가 core 를 전이로 가져오므로 core 를 따로 선언하지 않는다.
coreKtx = "1.19.1"
# coil-core 3.5.0 이 appcompat-resources 1.7.1 을 요구해 appcompat 그룹이 1.7.1 로 해석된다. 선언을 해석 결과에 맞춘다.
appcompat = "1.8.0"
# Compose material 은 BOM 이 관리하는 아티팩트지만 core-dependencies.gradle 을 쓰는 모듈 일부가 BOM 플랫폼 없이 받으므로 버전을 명시한다.
# → BOM 을 올릴 때 함께 올린다(2026-09-29 BOM 2026.09.00 상향 때 누락돼 1.11.4 선언 · 1.12.1 해석 드리프트가 남았다 — 2026-09-30 해소).
material = "1.12.1"
material3 = "1.4.0"
material3WindowSizeClass = "1.4.0"
room = "2.8.5"
# Retrofit 3.0.0 — okhttp 4.12.0 · (converter-gson) gson 2.13.1 을 요구하지만 둘 다 logging-interceptor(okhttp 5.4.0)·Ktor(gson 2.14.0) 쪽 요구보다 낮아 해석은 그대로다.
retrofit = "3.0.0"
# ktor-serialization-gson 3.5.2 가 2.14.0 을 요구해 해석 결과에 맞춘다(retrofit converter-gson 3.0.0 의 요구 2.13.1 보다 높다).
# 2.15.0(2026-10-26 상향, 마이너 — DEP-CURRENCY-16 사용자 승인). ktor-serialization-gson 3.6.0(2.14.0)·converter-gson(2.13.1) 요구보다
# 높아 해석은 이 선언을 따른다. 변경: 기본 Map 역직렬화 LinkedTreeMap → LinkedHashMap(프로젝트 Map 역직렬화 0)·숫자/BOM/서로게이트 파싱 수정·
# JsonReader.getCharacterOffset 추가. 전이 error_prone_annotations 2.48.0 → 2.50.0(어노테이션만). JVM jar 라 aar-metadata 없음.
gson = "2.15.0"
# logging-interceptor 는 같은 버전의 okhttp 코어를 요구하므로 사실상 코어 버전을 정한다(4.x 인터셉터를 5.x 코어와 섞지 않는다).
# 5.5.0(2026-09-29 상향, okhttp-android aar-metadata minCompileSdk 37 — DEP-CURRENCY-02 A). 변경: ECH 옵트인(API 37 플랫폼만)·
# Dns API 가 IP 외 레코드 지원·Okio 3.18.1. 커스텀 Dns 구현 없음.
# 5.5.1(2026-10-23 상향, 패치 — DEP-CURRENCY-15). 변경: 손상된 eMudhra 중간 인증서 8개 차단(GMS 기기는 이미 자동 업데이트, JVM·AOSP 보호용).
# aar-metadata(minCompileSdk 37)·전이 의존성은 5.5.0 과 같다.
okhttpLoggingInterceptor = "5.5.1"
# Ktor 3.6.0(2026-09-29 상향) — ktor-client-okhttp 가 okhttp 5.5.0 을 요구해 OkHttp 상향 뒤에 올렸다(5.5.0 은 minCompileSdk 37).
# 3.6.0 변경 중 영향권: Bearer 인증의 refresh 요청에서 Authorization 헤더 제거, OkHttp 엔진 취소 시 메인 스레드 본문 닫기 수정.
# (이전 3.5.2 는 okhttp 5.3.2 · coroutines 1.11.0 · gson 2.14.0 을 요구했다)
# 3.6.1(2026-10-30 패치 상향, DEP-CURRENCY-19 — 2026-10-29 발행): 버그 수정뿐. 클라이언트 쪽은 Android 엔진의 응답 읽기 취소 크래시 2건
# (Unbalanced enter/exit · 메인 스레드 close 의 NetworkOnMainThreadException) · 연결 누수 · HttpStatement.execute 정지 ·
# HttpRedirect 상대 Location 의 점 경로 정규화. 프로젝트 클라이언트는 OkHttp 엔진(DI)·MockEngine(예제)이라 Android 엔진 수정은 해당 없음.
ktor = "3.6.1"
# kotlinx-io 0.9.1 — Ktor 3.6.0 이 전이로 끌어오는 버전 그대로 선언(해석 결과 변화 0). HttpCache 의 FileStorage(Path, FileSystem) 가
# kotlinx.io.files.Path/SystemFileSystem 을 요구해 앱 코드가 직접 쓰므로 명시한다(DEP-VERSION-05: 직접 쓰는 라이브러리는 선언=해석).
kotlinxIoCore = "0.9.1"
# kotlinx-serialization — RememberPatterns 예제(#123)의 @Serializable 데이터 클래스를 rememberSerializable 로 저장하려고 직접 쓴다.
# 컴파일러 플러그인(org.jetbrains.kotlin.plugin.serialization)은 Kotlin 과 같은 버전으로 배포되므로 kotlinVersion 을 따른다.
# 1.12.0(2026-10-26 상향, 마이너 — DEP-CURRENCY-13 사용자 승인, #150 과 묶음). 1.11.0 은 savedstate 1.5.0 등의 전이와 같은 값이었고,
# 이제는 선언이 전이(savedstate·lifecycle·navigation·Ktor 1.11.0, security-state 의 json 1.7.3)보다 앞선다 — bom 1.12.0 이 json 까지 정렬.
# 변경: 역직렬화 중 예외(init 의 require 등)를 JsonDecodingException 으로 감쌈(메시지에 입력 JSON 포함)·JSON 중첩 깊이 제한·
# Json/Core API 안정화·ChunkedDecoder deprecated(프로젝트 미사용). stdlib 요구 2.4.10(프로젝트 2.4.21). JVM 아티팩트라 aar-metadata 없음.
kotlinxSerialization = "1.12.0"

