[versions]
# Android
compileSdk = "37"
minSdk = "24"
targetSdk = "35"
versionCode = "1"
versionName = "1.0"

# Java
javaVersion = "21"

# Kotlin & KSP
# kotlin-compose 플러그인(Kotlin 2.x) 사용으로 kotlinCompilerExtension 선언 불필요.
kotlinVersion = "2.4.20"
ksp = "2.3.9"
# AGP 9.4.1(2026-09-29 상향): Gradle 9.6.0+ 필요, 최대 API 37. AGP 8.x 는 Gradle 9.6+ 에서 제거된 내부 API 를 써서
# Gradle 만 먼저 올릴 수 없다(실측) → wrapper 9.8.0 과 한 번에 올린다. 내장 Kotlin(android.builtInKotlin) 사용 —
# Android 모듈은 org.jetbrains.kotlin.android 를 적용하지 않는다.
applicationVersion = "9.4.1"
libraryVersion = "9.4.1"

# Compose
# Compose BOM이 ui/animation/runtime/foundation/material 등의 개별 버전을 통합 관리한다.
# 개별 라이브러리 선언에서는 version을 지정하지 않음 — BOM이 전파한 버전을 그대로 사용.
# activity 1.13.0 — aar-metadata minCompileSdk=36 / minAGP=8.9.1. 이 버전부터 ComponentActivity 가 core 의 PictureInPictureProvider 를 구현한다(javap 확인).
activityCompose = "1.13.0"
# androidx.navigationevent — back/forward 양방향 내비게이션 이벤트 디스패처.
# 1.1.2 stable, aar-metadata minCompileSdk=36 / minAGP=8.9.1(채택 당시 compileSdk 36 · AGP 8.13.2 로 충족).
# navigationevent-compose 의 pom 은 compose ui/runtime 1.11.2 를 요구한다. BOM 2026.05.00(→ 1.11.1) 시절에는
# 이 요구가 이겨 ui/runtime 만 1.11.2 로 올라가는 패치 스큐가 있었으나, BOM 2026.06.01(→ 1.11.4) 상향으로
# 요구치가 BOM 보다 낮아져 스큐가 사라졌다. BOM 을 1.11.2 미만으로 내리면 다시 끌어올려진다.
navigationEvent = "1.1.2"
# androidx.navigation3 — ui 가 SceneStrategy/OverlayScene/NavDisplay, runtime 이 NavEntry/entryProvider/metadata 를 제공한다.
# 1.1.7 stable, aar-metadata minCompileSdk=36 / minAGP=8.9.1(채택 당시 compileSdk 36 · AGP 8.13.2 로 충족).
# ui pom 의 요구(activity-compose 1.12.0 · lifecycle 2.10.0 · compose 1.11.2 · navigationevent 1.1.2 · savedstate 1.4.0)가
# 전부 현재 해석 버전 이하라 전이 끌어올림이 없다. 1.2.0 라인은 minCompileSdk=37 이라 채택하지 않는다.
navigation3 = "1.1.7"
# 2026.06.01 = ui/runtime/foundation/animation/material 1.11.4 · material3 1.4.0 (aar-metadata minCompileSdk=35).
# 2026.08.00 이후(Compose 1.12.x)는 minCompileSdk=37 이라 채택하지 않는다.
composeBom = "2026.06.01"

# Lifecycle
# androidx.lifecycle 은 atomic group 이라 runtime/livedata/viewmodel 스택 전체가 한 버전으로 움직인다.
# 2.11.0(2026-09-29 상향, runtime-compose/viewmodel-compose minCompileSdk 37 · 최소 AGP 9.2). JetBrains 포크
# org.jetbrains.androidx.lifecycle 이 "prevents symbols duplication" 제약으로 2.11.0-beta01 로 올라가지만 Android 변형은
# 파일 없는 껍데기(androidx 로 위임)라 베타 코드는 들어오지 않는다.
# (이전) koin-android 4.2.2 가 lifecycle-viewmodel-ktx 2.10.0 을 요구해 스택 전체가 2.10.0 으로 해석되므로 선언을 그에 맞췄다
# (aar-metadata minCompileSdk: viewmodel/runtime 34, runtime-compose 35). 이전 값 2.9.4 는 compose-bom 의
# runtime-saveable 이 요구하던 하한이었다(1.11.4 도 2.9.4 요구 — 지금은 Koin 쪽 요구가 더 높다). (DEP-VERSION-03 과 동일 유형)
lifecycleRuntimeKtx = "2.11.0"
lifecycleLivedataKtx = "2.11.0"
lifecycleViewmodelKtx = "2.11.0"
lifecycleViewmodelCompose = "2.11.0"

# Koin 4.2.2 (DI-01 해소, 2026-09-15). 3.x 대비 코드 영향:
# ① koinViewModel 의 owner 파라미터 이름이 viewModelStoreOwner 로 바뀜 ② org.koin.androidx.compose.get 제거 → org.koin.compose.koinInject
# ③ org.koin.androidx.viewmodel.dsl.viewModel deprecated → org.koin.core.module.dsl.viewModel
# ④ koin-androidx-compose 가 주던 navigation-compose 전이 의존이 사라져 아래 navigationCompose 를 직접 선언한다.
# koin-android 4.2.2 는 lifecycle 2.10.0 · activity-ktx 1.12.4 · fragment-ktx 1.8.9 · appcompat 1.7.1 을 함께 요구한다.
koinCore = "4.2.2"
koinAndroid = "4.2.2"
koinAndroidxCompose = "4.2.2"
# navigation-compose — Koin 3.2.2 의 전이로 들어오던 2.4.2 를 명시 선언해 두었다가 2.9.8 로 상향(DEP-NAV-01).
# 2.10.2(2026-09-29 상향, minCompileSdk 37 · minAGP 9.1.0 — DEP-CURRENCY-02 A). savedstate 를 1.4.0 → 1.5.0 으로
# 함께 끌어올린다(navigation-common 요구, 1.5.0 은 기능 추가만). handleDeepLink 가 엄격해졌지만 딥링크 미사용.
# 사용처는 BottomNavigationActivity 1곳(문자열 route NavHost/composable/navigate — 2.9 에서도 유지되는 API).
navigationCompose = "2.10.2"

# Core-dependencies
# 1.17.0: NotificationCompat.ProgressStyle(Android 16 Live Updates)가 이 버전부터.
# 1.18.0: PictureInPictureParamsCompat / PictureInPictureProvider / PictureInPictureUiStateCompat /
#         DisplayShapeCompat 신규(PiP 예제가 사용).
# 1.19.1(2026-09-29 상향, minCompileSdk 37 / minAGP 9.1.0): core-ktx 가 core 로 병합돼 core-ktx 는 빈 아티팩트다
#         (core-ktx 1.18 의 132개 클래스가 core 1.19.1 에 전부 있음 — 바이너리 호환). BuildCompat.isAtLeastB* deprecated(미사용).
# 선언은 1.13.1 이었지만 실제 해석은 1.16.0 이던 드리프트를 2026-09-02 에 함께 해소했다.
# core-ktx 가 core 를 전이로 가져오므로 core 를 따로 선언하지 않는다.
coreKtx = "1.19.1"
# coil-core 3.5.0 이 appcompat-resources 1.7.1 을 요구해 appcompat 그룹이 1.7.1 로 해석된다. 선언을 해석 결과에 맞춘다.
appcompat = "1.8.0"
material = "1.11.4"
material3 = "1.4.0"
material3WindowSizeClass = "1.4.0"
room = "2.8.5"
# Retrofit 3.0.0 — okhttp 4.12.0 · (converter-gson) gson 2.13.1 을 요구하지만 둘 다 logging-interceptor(okhttp 5.4.0)·Ktor(gson 2.14.0) 쪽 요구보다 낮아 해석은 그대로다.
retrofit = "3.0.0"
# ktor-serialization-gson 3.5.2 가 2.14.0 을 요구해 해석 결과에 맞춘다(retrofit converter-gson 3.0.0 의 요구 2.13.1 보다 높다).
gson = "2.14.0"
# logging-interceptor 는 같은 버전의 okhttp 코어를 요구하므로 사실상 코어 버전을 정한다(4.x 인터셉터를 5.x 코어와 섞지 않는다).
# 5.4.0 = compileSdk 36 에서 쓸 수 있는 최고 버전(okhttp-android aar-metadata minCompileSdk 36).
# 5.5.0 은 minCompileSdk 37 이라 compileSdk/AGP 상향 묶음(DEP-CURRENCY-02 B)과 함께 올린다.
okhttpLoggingInterceptor = "5.4.0"
# Ktor 3.5.2 — ktor-client-okhttp 가 okhttp 5.3.2, 전 모듈이 kotlinx-coroutines 1.11.0, ktor-serialization-gson 이 gson 2.14.0 을 요구한다.
ktor = "3.5.2"

# Test
junit = "4.13.2"
androidxTestJunit = "1.3.0"
espressoCore = "3.7.0"
# 런타임에 들어온 kotlinx-coroutines-android 가 같은 버전의 kotlinx-coroutines-bom 을 함께 끌고 오고,
# 그 BOM 의 제약이 test 아티팩트까지 같은 버전으로 올린다(선언 1.7.1 ↔ 해석 1.10.1 불일치였음 — DEP-VERSION-05).
# Ktor 3.5.2 가 coroutines 1.11.0 을 요구해 런타임·테스트 모두 1.11.0 으로 해석되므로 선언을 맞춘다(직전에는 coil 3.5.0 발 1.10.2).
coroutineTest = "1.11.0"
mockk = "1.14.11"
turbine = "1.2.1"
runner = "1.7.0"
rules = "1.7.0"
espressoIntents = "3.7.0"

# Image Loader
# 3.5.0 이 채택 상한 — 3.6.x 는 aar-metadata minCompileSdk=37 이다.
coil3 = "3.5.0"

# Media
lottieCompose = "6.7.1"
# 1.11.1 — aar-metadata minCompileSdk=36 / minAGP=1.0.0.
media3 = "1.11.1"

# WorkManager
# 2.12.0 — aar-metadata minCompileSdk=35 / minAGP=8.6.0(실측). SystemForegroundService 매니페스트에 foregroundServiceType 이 없는 점은 2.9.1 과 같다(위치 예제 참고).
# pom 전이 끌어올림 0: tracing-ktx 1.2.0(프로젝트와 동일) · annotation-experimental 1.4.1(해석 1.5.0) · room 2.7.0(<2.8.5) · coroutines-android 1.9.0(<1.11.0).
# 2.11 의 워커 예외 핸들러 4종은 2.12 에도 그대로 있고 deprecated 도 아니다(javap 확인) → BaseApplication 무영향.
# 이 version.ref 는 work-runtime / work-runtime-ktx / work-testing 3개가 공유한다.
workRuntime = "2.12.0"

# Drag and Drop Library
reorderable = "0.9.6"

# SSE
# 5.0.0(2026-09-29 상향): 4.0 에서 API 재설계 — EventHandler → background.BackgroundEventHandler,
# 헤더/URI 는 ConnectStrategy.http(), reconnectTime → RetryDelayStrategy. pom 이 okhttp 4.12.0 요구(프로젝트 5.4.0) → 끌어올림 0.
okhttpEventSource = "5.0.0"

# Paging
# androidx.paging 은 atomic group 이라 runtime/compose/common-ktx 가 한 버전으로 움직인다.
# 3.5.1 — paging-runtime minCompileSdk=34, paging-compose-android minCompileSdk=35. room-paging 2.8.5 가 요구하는
# paging-common 3.3.2 보다 높아 선언이 그대로 해석된다. (이전: 3.2.1 선언 ↔ 3.3.2 해석 드리프트 — DEP-VERSION-03)
paging = "3.5.1"
pagingCompose = "3.5.1"

# Glance Widget
# 1.2.0 — aar-metadata minCompileSdk=35 / minAGP=8.6.0.
glance = "1.2.0"

# Biometric (alpha — biometric-compose는 alpha 단계만 존재)
# alpha07: minCompileSdk 36 / minAGP 8.9.1(충족) · pom 전이 끌어올림 0 · NegativeButton→DefaultCancel, 폴백 vararg(최대 4)
biometric = "1.4.0-alpha07"

# Tracing (Perfetto 커스텀 트레이스 이벤트)
# debugRuntimeClasspath 에는 이미 전이 해석되어 있으나 debugCompileClasspath 에는 없어(실측 확인)
# 코드에서 Trace 클래스를 직접 참조하려면 명시적 선언이 필요하다.
# 2.0.3(2026-09-29 상향): KMP 분리(tracing → tracing-android), aar minCompileSdk 34 / minAGP 8.1.1.
# Trace 정적 메서드 시그니처 동일 · trace{}/traceAsync 는 tracing-android 의 같은 TraceKt 로 이동(tracing-ktx 2.0.3 은 빈 껍데기)
# → 바이너리 호환. 전이: coroutines 1.9.0 · stdlib 2.1.20 · annotation 1.10.0 — 끌어올림 0.
tracing = "2.0.3"

[plugins]
android-application = { id = "com.android.application", version.ref = "applicationVersion" }
android-library = { id = "com.android.library", version.ref = "libraryVersion" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlinVersion" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinVersion" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# HotSwan(Compose Hot Reload) — 2026-09-15 2.0.0 으로 재활성화 (1.2.1 은 Kotlin 2.4.0 컴파일러 확장 API 와 충돌해 06-16~09-15 비활성).
# Gradle 플러그인 버전은 IDE 플러그인 버전과 일치해야 한다 — Marketplace 는 최신을 설치하므로 최신 patch 를 따른다.
# 2026-09-22 2.0.0 → 2.0.2: "Kotlin 2.4 에서 by-state 위임 프로퍼티를 가진 클래스가 첫 컴포지션에서 실패" 수정 포함.
# 2.0 의 공식 요구는 AGP 9.x — 2026-09-29 AGP 9.4.1 상향으로 공식 지원 범위 안(SKIPPED 42개 전후 동일, 서버 기동 확인).
# 핫 리로드가 오동작하면 1.3.7(Kotlin 2.4.0 지원)로 IDE 플러그인과 함께 내릴 것 (상세: ComposeHotReloadGuide.md).
hotswan-compiler = { id = "com.github.skydoves.compose.hotswan.compiler", version = "2.0.2" }

[libraries]
# Core-dependencies
coreKtx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "androidx.compose.material:material", version.ref = "material" }
materialIconsCore = { module = "androidx.compose.material:material-icons-core", version = "1.7.8" }
materialIconsExtended = { module = "androidx.compose.material:material-icons-extended", version = "1.7.8" }
material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
material3WindowSizeClass = { module = "androidx.compose.material3:material3-window-size-class", version.ref = "material3WindowSizeClass" }

roomRuntime = { module = "androidx.room:room-runtime", version.ref = "room" }
roomKtx = { module = "androidx.room:room-ktx", version.ref = "room" }
roomCompiler = { module = "androidx.room:room-compiler", version.ref = "room" }
# Room DAO 가 PagingSource 를 반환하려면 필요한 Paging3 통합 아티팩트.
# room-runtime 에 포함되지 않은 별도 모듈이라, 없으면 KSP 가
# "Cannot find required type element androidx.room.paging.LimitOffsetPagingSource" 로 실패한다.
# 전 모듈 전이 주입(core-dependencies.gradle)을 피하려고 bundles.room 이 아닌 app 모듈에서만 선언한다.
roomPaging = { module = "androidx.room:room-paging", version.ref = "room" }

retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
converterGson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
okhttpLoggingInterceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttpLoggingInterceptor" }

ktorClientAndroid = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }
ktorClientOkHttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktorClientCore = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktorClientLogging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktorClientContentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktorSerializationGson = { module = "io.ktor:ktor-serialization-gson", version.ref = "ktor" }
ktorClientAuth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktorClientMock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

junit = { module = "junit:junit", version.ref = "junit" }
androidxTestJunit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
espressoCore = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }
junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
uiTooling = { module = "androidx.compose.ui:ui-tooling" }

# Unit Test Dependency
coroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutineTest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
# Kotlin 플러그인이 kotlin-test 계열을 컴파일러 버전으로 정렬하므로 별도 버전 키를 두면 반드시 어긋난다
# (선언 1.8.20 ↔ 해석 2.4.0 이었음). kotlinVersion 에 묶어 재발을 막는다. (DEP-VERSION-05)
kotlinTestJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlinVersion" }
kotlinTest = { module = "org.jetbrains.kotlin:kotlin-test" }

# UI Test Dependency
# ui-test-junit4 는 위 junit4 별칭 하나로 통일한다. (DEP-VERSION-02)
testRunner = { module = "androidx.test:runner", version.ref = "runner" }
testRules = { module = "androidx.test:rules", version.ref = "rules" }
testManifest = { module = "androidx.compose.ui:ui-test-manifest" }
espressoIntents = { module = "androidx.test.espresso:espresso-intents", version.ref = "espressoIntents" }

# Module
# Compose
composeBom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
composeUi = { module = "androidx.compose.ui:ui" }
composeAnimation = { module = "androidx.compose.animation:animation" }
runtime = { module = "androidx.compose.runtime:runtime" }
runtimeLiveData = { module = "androidx.compose.runtime:runtime-livedata" }
uiToolingPreview = { module = "androidx.compose.ui:ui-tooling-preview" }
activityCompose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
navigationEvent = { module = "androidx.navigationevent:navigationevent", version.ref = "navigationEvent" }
navigationEventCompose = { module = "androidx.navigationevent:navigationevent-compose", version.ref = "navigationEvent" }
navigation3Runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3Ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
navigationCompose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# Lifecycle
lifecycleViewmodelKtx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycleViewmodelKtx" }
lifecycleViewmodelCompose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
lifecycleRuntimeKtx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
lifecycleLivedataKtx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycleLivedataKtx" }

# Dependency Injection - Koin
koinCore = { module = "io.insert-koin:koin-core", version.ref = "koinCore" }
koinAndroid = { module = "io.insert-koin:koin-android", version.ref = "koinAndroid" }
koinAndroidxCompose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koinAndroidxCompose" }

# Image Loader
coil3Compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil3" }
coil3NetworkOkhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil3" }
coil3Gif = { module = "io.coil-kt.coil3:coil-gif", version.ref = "coil3" }

# Media
lottieCompose = { module = "com.airbnb.android:lottie-compose", version.ref = "lottieCompose" }
media3Exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3Ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }

# WorkManager
workRuntime = { module = "androidx.work:work-runtime", version.ref = "workRuntime" }
workRuntimeKtx = { module = "androidx.work:work-runtime-ktx", version.ref = "workRuntime" }
# WorkManager 테스트 하네스(TestDriver/TestListenableWorkerBuilder). work 런타임과 같은 버전을 쓴다.
# work 2.12.0 의 aar-metadata 는 minCompileSdk=35 / minAGP=8.6.0 이다.
workTesting = { module = "androidx.work:work-testing", version.ref = "workRuntime" }

# Drag and Drop Library
reorderable = { module = "org.burnoutcrew.composereorderable:reorderable", version.ref = "reorderable" }

# SSE
okhttpEventSource = { module = "com.launchdarkly:okhttp-eventsource", version.ref = "okhttpEventSource" }

# Paging
pagingRuntime = { module = "androidx.paging:paging-runtime", version.ref = "paging" }
pagingCompose = { module = "androidx.paging:paging-compose", version.ref = "pagingCompose" }

# Glance Widget
# glance-appwidget 이 glance 코어를 전이 포함한다.
# material/material3/preview/appwidget-preview 는 실사용 import 0건이라 제거. (DEP-DEAD-03)
glanceAppwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }

# Biometric
biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
biometricCompose = { module = "androidx.biometric:biometric-compose", version.ref = "biometric" }

# Tracing
tracing = { module = "androidx.tracing:tracing", version.ref = "tracing" }

[bundles]
retrofit = [
    "retrofit",
    "converterGson",
    "gson",
    "okhttpLoggingInterceptor"
]

ktor = [
    "ktorClientAndroid",
    "ktorClientOkHttp",
    "ktorClientContentNegotiation",
    "ktorClientCore",
    "ktorClientLogging",
    "ktorSerializationGson",
    "ktorClientAuth",
    "ktorClientMock"
]

room = [
    "roomKtx",
    "roomRuntime"
]

androidTest = [
    "androidxTestJunit",
    "espressoCore",
    "junit4",
]

unitTest = [
    "coroutinesTest",
    "mockk",
    "turbine",
    "kotlinTestJunit",
    "kotlinTest"
]

uiTest = [
    "junit4",
    "espressoCore",
    "testRunner",
    "testRules",
    "espressoIntents",
]

image = [
    "coil3Compose",
    "coil3NetworkOkhttp",
    "coil3Gif",
]

koin = [
    "koinAndroid",
    "koinAndroidxCompose",
    "koinCore"
]

lifecycle = [
    "lifecycleRuntimeKtx",
    "lifecycleLivedataKtx",
    "lifecycleViewmodelCompose",
    "lifecycleViewmodelKtx"
]

media = [
    "lottieCompose",
    "media3Exoplayer",
    "media3Ui"
]

workManager = [
    "workRuntime",
    "workRuntimeKtx"
]

dragAndDrop = [
    "reorderable"
]

paging = [
    "pagingRuntime",
    "pagingCompose"
]

glance = [
    "glanceAppwidget"
]