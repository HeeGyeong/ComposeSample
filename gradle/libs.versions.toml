# debugRuntimeClasspath 에는 이미 전이 해석되어 있으나 debugCompileClasspath 에는 없어(실측 확인)
# 코드에서 Trace 클래스를 직접 참조하려면 명시적 선언이 필요하다.
# 2.0.3(2026-09-29 상향): KMP 분리(tracing → tracing-android), aar minCompileSdk 34 / minAGP 8.1.1.
# Trace 정적 메서드 시그니처 동일 · trace{}/traceAsync 는 tracing-android 의 같은 TraceKt 로 이동(tracing-ktx 2.0.3 은 빈 껍데기)
# → 바이너리 호환. 전이: coroutines 1.9.0 · stdlib 2.1.20 · annotation 1.10.0 — 끌어올림 0.
# 2026-10-13 2.0.4 패치 상향(DEP-CURRENCY-09) — trace 패킷 flush 경쟁 조건 수정(프로세스 내 기록 API, 프로젝트는 Trace 정적 메서드만).
# aar 요구치·pom 전이 2.0.3 과 같다.
# 2026-10-22 2.0.5 패치 상향(DEP-CURRENCY-14) — 패킷 풀에서 같은 스레드가 flush·release 를 겹쳐 하던 경쟁(교착 가능) 수정.
# 역시 프로세스 내 기록 API 쪽 — aar 요구치(compileSdk 34 · AGP 8.1.1)·module 전이 2.0.4 와 같다.
# 2026-10-30 tracing-wire 2.0.5 추가(#124, 사용자 승인 — tracing 과 같은 version.ref). aar-metadata minCompileSdk 34 / minAGP 8.1.1.
# 해석 diff(app 5구성): tracing-wire(+android)·wire-runtime 6.4.0(+jvm) 신규, startup-runtime 은 컴파일 경로만 1.1.1 → 1.2.0(런타임은 원래 1.2.0).
# 이 라이브러리 매니페스트의 App Startup ConnectedProfilerTracingInitializer 는 시작마다 빈 트레이스 파일을 쌓아 AndroidManifest 에서 뺐다.
tracing = "2.0.5"

# Security State(#115, 2026-10-26 신규 — 사용자 승인) — 기기 SPL·커널·Mainline 모듈 버전을 로컬로 읽고,
# OSV 취약점 보고서(JSON)와 대조해 게시된 SPL·패치된 CVE 를 계산한다. aar-metadata minCompileSdk=36 / minAGP=8.9.1(현재 37 / 9.4.1).
# module 런타임 전이: kotlinx-serialization-json 1.7.3 · androidx.webkit 1.11.0 · concurrent-futures-ktx 1.3.0 · core 1.12.0 ·
# coroutines 1.9.0 · stdlib 2.1.20 · annotation 1.8.1 · listenablefuture 1.0. 추가 전후 해석 diff(app 5구성): 새로 security-state 1.1.0 ·
# webkit 1.11.0(런타임) · serialization-json 1.11.0(release 런타임 — 1.7.3 요청이 serialization-bom 1.11.0 으로 정렬, debug 런타임엔 이미 있음),
# 끌어올림 concurrent-futures(-ktx) 1.1.0 → 1.3.0(런타임만 — JSpecify 널 어노테이션 추가뿐, WorkManager·profileinstaller 가 내부 사용),
# debugCompileClasspath 는 security-state 1개만 늘고 androidTest 런타임 변화 0.
# 1.1.0 에서 DEFAULT_VULNERABILITY_REPORTS_URL(storage.googleapis.com)은 deprecated("will stop working")
# → createVulnerabilityReportUrl()(https://android-api.osv.dev/v1/android_sdk_<API>.json)을 쓴다.
securityState = "1.1.0"

# Material3 Adaptive(#118, 2026-10-26 신규 — 사용자 승인) — ListDetailPaneScaffold·SupportingPaneScaffold(adaptive-layout)와
# ThreePaneScaffoldNavigator·Navigable*Scaffold(adaptive-navigation), currentWindowAdaptiveInfo(adaptive). 셋은 같은 버전으로 움직인다.
# 1.3.0 aar-metadata minCompileSdk=37 / minAGP=9.1.0(현재 37 / 9.4.1). API 대부분이 @ExperimentalMaterial3AdaptiveApi.
# module 런타임 요구: compose foundation/ui/animation 1.9.0~1.10.0(BOM 1.12.1 보다 낮음) · core 1.15.0 · activity-compose 1.10.1 ·
# androidx.window 1.5.0 · window-core 1.5.0. 추가 전후 해석 diff(app 5구성): adaptive 3종(+ -android) 추가, compile 클래스패스에
# window·window-core 1.5.0 추가(런타임엔 이미 1.5.0), annotation-experimental 1.5.0 → 1.5.1(compile 은 1.4.1 → 1.5.1) 패치 끌어올림뿐.
adaptive = "1.3.0"

# DataStore(#143, 2026-10-26 신규 — 사용자 승인) — Preferences DataStore 와 타입 DataStore(FileStorage + 손 Serializer)를
# SharedPreferences 와 대조한다. 1.3.0(2026-10-21) aar-metadata minCompileSdk=34 / minAGP=8.1.1.
# module 런타임 요구: datastore-core·core-okio·preferences-core·preferences-proto 1.3.0 · okio 3.17.0 · tracing 2.0.1 ·
# coroutines 1.9.0 · stdlib 2.2.20 · annotation 1.9.1 · atomicfu 0.28.0. 추가 전후 해석 diff(app 5구성): DataStore 는 이미 Glance 1.2.0 의
# 전이로 1.0.0(datastore·core·preferences·preferences-core)이 있었다 → 1.3.0 으로 끌어올림 + core-okio·preferences-proto·
# external-protobuf·atomicfu 0.28.0 추가. Glance 1.2.0 바이트코드가 부르는 datastore 멤버 21개 전부 1.3.0 에 링크됨(javap 대조 —
# MutablePreferences.toPreferences 는 1.3.0 에서 상위 Preferences 로 옮겨져 상속으로 해석).
datastore = "1.3.0"

# Molecule(#86, 2026-10-30 신규 — 사용자 승인) — Compose runtime 으로 UI 밖에서 상태(StateFlow)를 만드는 Cash App 라이브러리.
# 2.2.0(stable, 2025-09) KMP — Android 변형 molecule-runtime-android 의 aar-metadata minCompileSdk=1 / minAGP=1.0.0.
# module 요구: compose runtime 1.9.1 · coroutines-core 1.10.2 · stdlib 2.2.20 · (런타임) core-ktx 1.17.0 — 전부 프로젝트보다 낮다.
moleculeRuntime = "2.2.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "applicationVersion" }
android-library = { id = "com.android.library", version.ref = "libraryVersion" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlinVersion" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinVersion" }
# Power-Assert — 단언 실패 메시지에 식의 중간값을 펼쳐 넣는 Kotlin 컴파일러 플러그인(PowerAssertExample).
# Kotlin 과 같은 버전으로 배포되므로 kotlinVersion 을 따른다. 적용된 컴파일에는 kotlin-power-assert-runtime(같은 버전, 27KB, stdlib 만 의존)이
# 플러그인에 의해 자동으로 추가된다(addRuntimeDependency 기본 true) — 카탈로그에 따로 선언하지 않는다.
kotlin-power-assert = { id = "org.jetbrains.kotlin.plugin.power-assert", version.ref = "kotlinVersion" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlinVersion" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# HotSwan(Compose Hot Reload) — 2026-09-15 2.0.0 으로 재활성화 (1.2.1 은 Kotlin 2.4.0 컴파일러 확장 API 와 충돌해 06-16~09-15 비활성).
# Gradle 플러그인 버전은 IDE 플러그인 버전과 일치해야 한다 — Marketplace 는 최신을 설치하므로 최신 patch 를 따른다.
# 2026-09-22 2.0.0 → 2.0.2: "Kotlin 2.4 에서 by-state 위임 프로퍼티를 가진 클래스가 첫 컴포지션에서 실패" 수정 포함.
# 2.0 의 공식 요구는 AGP 9.x — 2026-09-29 AGP 9.4.1 상향으로 공식 지원 범위 안(SKIPPED 42개 전후 동일, 서버 기동 확인).
# 2026-10-01 2.0.2 → 2.1.0: SKIPPED 49개 전후 동일, 서버 기동·기준 클래스 1936개 등록, 전 화면 렌더 감사 191/191.
#   Power-Assert 예제의 hotSwanCompiler.exclude 2줄은 2.1.0 에서도 필요(빼면 NotImplementedError 재현).
# 핫 리로드가 오동작하면 1.3.7(Kotlin 2.4.0 지원)로 IDE 플러그인과 함께 내릴 것 (상세: ComposeHotReloadGuide.md).
