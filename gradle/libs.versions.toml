# 헤더/URI 는 ConnectStrategy.http(), reconnectTime → RetryDelayStrategy. pom 이 okhttp 4.12.0 요구(프로젝트 5.4.0) → 끌어올림 0.
# 5.0.1(2026-10-13 패치 상향, DEP-CURRENCY-10): 스트림을 멈출 때 읽기 스레드에서 응답 InputStream 을 닫아 HTTP 응답을 놓는다
